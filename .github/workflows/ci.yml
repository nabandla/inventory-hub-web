name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # npm ci installs exactly what package-lock.json says (reproducible), unlike npm install
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      # The build proves the app compiles for production. These are public, non-secret placeholders:
      # the real values are baked in at deploy time, never stored in the repository.
      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://example.invalid
          VITE_TENANT_ID: 00000000-0000-0000-0000-000000000000
          VITE_CLIENT_ID: 00000000-0000-0000-0000-000000000000
          VITE_API_SCOPE: api://00000000-0000-0000-0000-000000000000/access_as_user
